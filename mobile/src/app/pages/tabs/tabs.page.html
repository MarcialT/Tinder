<ion-tabs (ionTabsWillChange)="onTabChange($event.tab)">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="descubrir" href="/tabs/descubrir">
      <ion-icon name="flame-outline"></ion-icon>
      <ion-label>Descubrir</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="amigos" href="/tabs/amigos">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <ion-label>Amigos</ion-label>
      @if (unread() > 0) {
        <ion-badge color="danger">{{ unread() }}</ion-badge>
      }
    </ion-tab-button>

    <ion-tab-button tab="perfil" href="/tabs/perfil">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
